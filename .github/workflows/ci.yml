name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the deterministic writer tests
        run: |
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Validate JSON manifests
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/brainstorming-intent-continuity/.codex-plugin/plugin.json >/dev/null
